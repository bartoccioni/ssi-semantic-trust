id: https://w3id.org/sem-trust/v1#trust-relation
name: trust-relation
prefixes:
  linkml: https://w3id.org/linkml/
  odrl: http://www.w3.org/ns/odrl/2/
  st: https://w3id.org/sem-trust/v1
imports:
  - linkml:types
  - trust-scope
  - attribute
  - role
  - permission
default_prefix: st
default_range: string

classes:

  TrustRelation:
    description: The class representing a trust relation between scopes.
    slots:
      - trustorScope
      - trustedScope
      - hasPolicy
      - mapping

  TrustMapping:
    description: The class defining how the translation between Scopes is to be performed
    slots:
      - trusted
      - trustor

slots:
  trustorScope:
    description: The trustor scope that extend its trust 
    required: false
    multivalued: false
    range: TrustScope
  trustedScope:
    description: The trusted scope to trust
    required: false
    multivalued: false
    range: TrustScope
  hasPolicy:
    description: A list of policy expressed using ODRL to be used to verify if the relation is to be considered "active" and "valid"
    name: hasPolicy
    range: string
    slot_uri: odrl:hasPolicy
  mapping:
    description: A list of TrustMapping, to be used for translation
    required: false
    multivalued: true
    range: TrustIdentityProvider
  trusted:
    description: A Type or one of its Claim defined in the schema/vocabulary of the Trusted scope  
    required: false
    multivalued: false
    any_of:
    - range: Attribute
    - range: Role
    - range: Permission
  trustor:
    description: A Type or one of its Claim defined in the schema/vocabulary of the Trustor scope
    required: false
    multivalued: false
    any_of:
    - range: Attribute
    - range: Role
    - range: Permission




id: https://w3id.org/sem-trust/v1/digital-identity
name: digital-identity
prefixes:
  linkml: https://w3id.org/linkml/
  st: https://w3id.org/sem-trust/v1
imports:
  - linkml:types
default_prefix: st
default_range: string

classes:

  TrustedDigitalIdentity:
    description: A Cryptographic Digital Identity that is identified by ONE and only ONE keypair and whose trustwortyness is guaranteed by a Trust Identity Provider.
    slots: 
      - publicKeyId
      - controller
      - level
      - publicKeyDigest

slots:
  # slots for Digital Identities
  publicKeyId: 
    identifier: true
    description: The resolvable link to the digital identity's verificationMethod used to uniquely identify ONE and ONLY key pair
    required: true
    multivalued: false
    range: uri
  publicKeyDigest:
    description: The digest (hash) of the public key identified by the Digital Identity id attribute 
    required: true
    multivalued: false
    range: string
  controller:
    description: The kind of the controller of the Digital Identity 
    required: true
    multivalued: false
    range: ControllerKind
  level:
    description: The trust level of the Trusted Identity Provider
    required: false
    multivalued: false
    range: ControllerKind

enums:
  ControllerKind:
    permissible_values:
      Anonymous:
        description: Keypair self issued and no info on controller 
      MachineControlled:
        description: Keypair self issued and controlled by machine or process
      HumanControlled:
        description: Keypair managed by a device wallet controlled by a human (multi-factor authenticated)
  TrustLevel:
    permissible_values:
      Scoped:
        description: The Trusted Identity Provider is self-defined in the scope (e.g. data space, ecosystem, organisation, etc)
      Standard:
        description: The Trusted Identity Provider is a Trust Service Provider belonging to an internationally accepted Trust Framework( CA/B Forum for SSL X509 Certificates, Etc.)
      Qualified:
        description: The Trusted Identity Provider is a Qualified Trust Service Provider belonging to the eIDAS Framework (both X.509 certificats and EUDIW Wallet)
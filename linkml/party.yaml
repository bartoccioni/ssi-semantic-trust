id: https://w3id.org/sem-trust/v1#party
name: party
prefixes:
  linkml: https://w3id.org/linkml/
  odrl: http://www.w3.org/ns/odrl/2/
  st: https://w3id.org/sem-trust/v11
imports:
  - linkml:types
  - digital-identity
  - scope
  - attribute
  - role
  - permission
default_prefix: st
default_range: string

classes:
  Party:
    description: The class representing a generic Party.
    slots:
      - holder
      - trustScope
      - hasPolicy
      - identityAttributes
      - identityRoles
      - identityPermissions
      - parentPartyCredential
      - parentPartyCredentialDigest

slots:
  holder:
    description: Strong digital identity of the holder
    required: true
    multivalued: false
    range: StrongDigitalIdentity
  hasPolicy:
    description: a list of policy expressed using ODRL
    name: hasPolicy
    range: string
    slot_uri: odrl:hasPolicy
  identityAttributes:
    description: A list of Identity Attributes to be used in a ABAC context
    required: false
    multivalued: true
    range: Attribute 
  identityRoles:
    description: A list of Identity Roles to be used in a RBAC context
    required: false
    multivalued: true
    range: Role
  identityPermissions:
    description: A list of Identity Permissions to be used in a Access Control context
    required: false
    multivalued: true
    range: Permission 
  parentPartyCredential:
    description: Used to create a delegation chain and contains a resolvable link to the parent Party Credential where the holder MUST be equal to the signer(issuer verificationMethod) of this credential
    required: false
    range: Party
  parentPartyCredentialDigest:
    description: The digest (hash) of the public key identified by the Digital Identity id attribute 
    required: true
    multivalued: false
    range: string
